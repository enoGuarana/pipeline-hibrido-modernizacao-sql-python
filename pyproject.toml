[project]
name = "pipeline-modernizacao-sql-python"
version = "0.1.0"
description = "Esqueleto do pipeline híbrido de modernização PL/pgSQL para Python."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "langgraph>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

