[project]
name = "pipeline-modernizacao-sql-python"
version = "0.1.0"
description = "Pipeline hibrido de modernizacao PL/pgSQL para Python."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "langgraph==1.2.12",
    "langgraph-cli[inmem]==0.4.32",
    "langgraph-api==0.10.3",
    "google-genai==2.27.0",
    "openai==2.54.0",
    "httpx==0.28.1",
    "truststore==0.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
observability = [
    "langfuse>=4.7,<5",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
